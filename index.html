<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Battambang:wght@400;700&family=Moul&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
<title>ពិន្ទុថ្នាក់ទី៧D</title>
<style>
    :root {
        --primary: #6366f1;
        --primary-2: #8b5cf6;
        --primary-dark: #4f46e5;
        --primary-soft: rgba(99,102,241,0.10);
        --primary-soft-strong: rgba(99,102,241,0.18);
        --success: #10b981;
        --danger: #ef4444;
        --ink: #1e2233;
        --ink-soft: #6b7280;
        --card: rgba(255,255,255,0.86);
        --card-solid: #ffffff;
        --line: rgba(15,23,42,0.08);
        --radius-lg: 18px;
        --radius-md: 12px;
        --radius-sm: 8px;
        --shadow-sm: 0 2px 10px rgba(30,34,64,0.06);
        --shadow-md: 0 10px 30px rgba(30,34,64,0.10);
        --shadow-lg: 0 20px 50px rgba(30,34,64,0.16);
        --ease: cubic-bezier(.4,0,.2,1);
        --ease-bounce: cubic-bezier(.34,1.56,.64,1);
    }

    * { box-sizing: border-box; }

    body {
        font-family: "Battambang", "Inter", system-ui, sans-serif;
        background:
            radial-gradient(circle at 8% 8%, rgba(99,102,241,0.14), transparent 40%),
            radial-gradient(circle at 92% 18%, rgba(236,72,153,0.10), transparent 42%),
            radial-gradient(circle at 50% 100%, rgba(16,185,129,0.08), transparent 45%),
            #f4f5fb;
        min-height: 100vh;
        margin: 0;
        color: var(--ink);
        -webkit-font-smoothing: antialiased;
        animation: bodyIn 0.5s var(--ease);
    }
    @keyframes bodyIn {
        from { opacity: 0; }
        to { opacity: 1; }
    }

    header {
        position: sticky;
        top: 0;
        background: rgba(255,255,255,0.78);
        backdrop-filter: blur(16px) saturate(160%);
        -webkit-backdrop-filter: blur(16px) saturate(160%);
        padding: 14px 18px;
        display: flex;
        gap: 12px;
        box-shadow: var(--shadow-sm);
        border-bottom: 1px solid var(--line);
        z-index: 10;
        font-family: "Battambang", "Inter", system-ui;
        transition: box-shadow .25s var(--ease);
        animation: slideDown .4s var(--ease);
    }
    @keyframes slideDown {
        from { opacity: 0; transform: translateY(-14px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .header-row {
        display: flex;
        align-items: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    .header-main-row {
        justify-content: space-between;
    }
    .header-controls-row {
        justify-content: flex-start;
    }
    .header-actions-row {
        justify-content: space-between;
        border-top: 1px solid var(--line);
        padding-top: 10px;
    }
    .quick-score-group {
        display: flex;
        gap: 8px;
        align-items: center;
    }
    #quickScore {
        width: 90px;
    }
    .action-buttons-group {
        display: flex;
        gap: 8px;
    }
    .container {
        display: flex;
        gap: 20px;
        padding: 18px;
        font-family: "Battambang", "Inter", system-ui;
        max-width: 1400px;
        margin: 0 auto;
    }

    .panel {
        background: var(--card);
        backdrop-filter: blur(10px);
        border: 1px solid var(--line);
        border-radius: var(--radius-lg);
        padding: 0;
        flex: 1;
        box-shadow: var(--shadow-md);
        display: flex;
        flex-direction: column;
        max-height: calc(100vh - 170px);
        overflow: hidden;
        animation: panelRise .45s var(--ease);
    }
    @keyframes panelRise {
        from { opacity: 0; transform: translateY(16px) scale(.98); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .panel.fade-swap {
        animation: panelSwap .38s var(--ease);
    }
    @keyframes panelSwap {
        0% { opacity: 0; transform: translateY(10px) scale(.985); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }

    .student-header {
        position: sticky;
        top: 0;
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(6px);
        padding: 14px;
        z-index: 5;
        border-bottom: 1px solid var(--line);
        font-family: "Battambang", "Inter", system-ui;
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
    }
    .student-header input {
        flex: 1;
        min-width: 150px;
    }
    .student-list {
        overflow-y: auto;
        flex: 1;
        padding: 12px;
        scrollbar-width: thin;
        scrollbar-color: rgba(99,102,241,0.35) transparent;
    }
    .student-list::-webkit-scrollbar { width: 8px; }
    .student-list::-webkit-scrollbar-track { background: transparent; }
    .student-list::-webkit-scrollbar-thumb {
        background: rgba(99,102,241,0.30);
        border-radius: 10px;
    }
    .student-list::-webkit-scrollbar-thumb:hover {
        background: rgba(99,102,241,0.5);
    }

    .student-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 9px 12px;
        border: 1px solid var(--line);
        background: var(--card-solid);
        border-radius: var(--radius-md);
        margin-bottom: 8px;
        font-family: "Battambang", "Inter", system-ui;
        gap: 10px;
        box-shadow: 0 1px 3px rgba(30,34,64,0.04);
        transition: transform .2s var(--ease), box-shadow .2s var(--ease), border-color .2s var(--ease);
        animation: itemIn .38s var(--ease) both;
        opacity: 0;
    }
    @keyframes itemIn {
        from { opacity: 0; transform: translateY(10px); }
        to { opacity: 1; transform: translateY(0); }
    }
    .student-item:hover {
        transform: translateY(-2px);
        box-shadow: var(--shadow-sm);
        border-color: rgba(99,102,241,0.35);
    }
    .student-item span {
        flex: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-weight: 500;
    }
    .student-icon {
        flex: 0 0 auto;
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 50%;
        background: linear-gradient(135deg, var(--primary), var(--primary-2));
        color: #fff;
        font-size: 0.72rem;
        box-shadow: 0 3px 8px rgba(99,102,241,0.35);
        transition: transform .2s var(--ease-bounce);
    }
    .student-item:hover .student-icon {
        transform: scale(1.1) rotate(-6deg);
    }

    .btn-blue, .btn-gray {
        border: none;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 0.95rem;
        font-family: "Battambang", "Inter", system-ui;
        white-space: nowrap;
        padding: 9px 16px;
        position: relative;
        overflow: hidden;
        transition: transform .18s var(--ease), box-shadow .18s var(--ease), background .2s var(--ease), color .2s var(--ease), filter .2s var(--ease);
        isolation: isolate;
    }
    .btn-blue {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        box-shadow: 0 4px 14px rgba(79,70,229,0.30);
    }
    .btn-blue:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 8px 22px rgba(79,70,229,0.40);
        filter: brightness(1.05);
    }
    .btn-blue:active:not(:disabled) {
        transform: translateY(0) scale(.97);
    }
    .btn-gray {
        background: var(--primary-soft);
        color: var(--primary-dark);
    }
    .btn-gray:hover:not(:disabled) {
        transform: translateY(-2px);
        background: var(--primary-soft-strong);
        box-shadow: var(--shadow-sm);
    }
    .btn-gray:active:not(:disabled) {
        transform: translateY(0) scale(.97);
    }
    button:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
        filter: none !important;
    }
    button:disabled:hover {
        transform: none;
    }
    button a {
        color: inherit;
        text-decoration: none;
    }

    .ripple {
        position: absolute;
        border-radius: 50%;
        background: rgba(255,255,255,0.55);
        transform: scale(0);
        animation: rippleAnim .55s ease-out;
        pointer-events: none;
        z-index: 0;
    }
    .btn-gray .ripple {
        background: rgba(99,102,241,0.25);
    }
    @keyframes rippleAnim {
        to { transform: scale(2.6); opacity: 0; }
    }

    .score-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
        gap: 12px;
    }
    .score-box {
        display: flex;
        flex-direction: column;
        gap: 6px;
        background: #fff;
        border: 1px solid var(--line);
        border-radius: var(--radius-md);
        padding: 10px;
        transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .2s var(--ease);
        animation: itemIn .35s var(--ease) both;
        opacity: 0;
    }
    .score-box:hover {
        border-color: rgba(99,102,241,0.35);
        box-shadow: var(--shadow-sm);
    }
    .score-box label {
        font-size: 0.85rem;
        color: var(--ink-soft);
        font-weight: 500;
    }
    input[type="number"], input[type="text"], select {
        padding: 9px 10px;
        border: 1.5px solid var(--line);
        border-radius: var(--radius-sm);
        width: 100%;
        box-sizing: border-box;
        font-family: "Battambang", "Inter", system-ui;
        font-size: 1rem;
        background: #fff;
        color: var(--ink);
        transition: border-color .2s var(--ease), box-shadow .2s var(--ease), transform .15s var(--ease);
    }
    input[type="number"]:focus, input[type="text"]:focus, select:focus {
        outline: none;
        border-color: var(--primary);
        box-shadow: 0 0 0 4px var(--primary-soft);
    }
    input:disabled, select:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        background: #f0f0f0;
    }

    /* --- Custom 3-Column Dropdown Styles --- */
    .dropdown-container {
        position: relative;
    }
    .grid-dropdown-content {
        display: grid;
        position: absolute;
        top: 100%;
        left: 0;
        background-color: #fff;
        width: 320px;
        box-shadow: var(--shadow-lg);
        z-index: 100;
        border-radius: var(--radius-md);
        padding: 10px;
        border: 1px solid var(--line);
        margin-top: 8px;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
        box-sizing: border-box;
        opacity: 0;
        visibility: hidden;
        transform: translateY(-8px) scale(0.97);
        transform-origin: top left;
        pointer-events: none;
        transition: opacity .18s var(--ease), transform .18s var(--ease), visibility .18s;
    }
    .grid-dropdown-content.show {
        opacity: 1;
        visibility: visible;
        transform: translateY(0) scale(1);
        pointer-events: auto;
    }
    .grid-choice {
        padding: 9px 4px;
        text-align: center;
        background: #f4f5fb;
        border-radius: var(--radius-sm);
        cursor: pointer;
        font-size: 0.88rem;
        user-select: none;
        color: #333;
        transition: background .18s var(--ease), color .18s var(--ease), transform .15s var(--ease);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }
    .grid-choice:hover {
        background: var(--primary);
        color: white;
        transform: translateY(-1px);
    }
    .grid-choice.active {
        background: linear-gradient(135deg, var(--primary), var(--primary-dark));
        color: white;
        font-weight: bold;
        box-shadow: 0 3px 10px rgba(79,70,229,0.35);
    }

    @keyframes spin {
        to { transform: rotate(360deg); }
    }
    #saveStatus, #saveStatush {
        display: none;
    }

    /* --- Popup toast --- */
    #toastLayer {
        position: fixed;
        top: 20px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 1000;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        pointer-events: none;
    }
    .toast-popup {
        display: flex;
        align-items: center;
        gap: 10px;
        background: rgba(255,255,255,0.92);
        backdrop-filter: blur(10px);
        border-radius: 14px;
        padding: 13px 22px;
        box-shadow: var(--shadow-lg);
        font-family: "Battambang", "Inter", system-ui;
        font-size: 1rem;
        font-weight: bold;
        color: #333;
        border-left: 5px solid var(--primary);
        opacity: 0;
        transform: translateY(-30px) scale(0.9);
        animation: toastIn 0.4s var(--ease-bounce) forwards;
        max-width: 90vw;
        white-space: nowrap;
    }
    .toast-popup.toast-out {
        animation: toastOut 0.3s ease forwards;
    }
    .toast-popup.toast-saving { border-left-color: var(--primary); }
    .toast-popup.toast-success { border-left-color: var(--success); }
    .toast-popup.toast-error { border-left-color: var(--danger); }

    @keyframes toastIn {
        0% { opacity: 0; transform: translateY(-30px) scale(0.9); }
        60% { opacity: 1; transform: translateY(4px) scale(1.03); }
        100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    @keyframes toastOut {
        0% { opacity: 1; transform: translateY(0) scale(1); }
        100% { opacity: 0; transform: translateY(-20px) scale(0.9); }
    }

    .status-spinner {
        width: 16px;
        height: 16px;
        border: 2.5px solid rgba(99,102,241,0.25);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.6s linear infinite;
        flex-shrink: 0;
    }
    .status-check {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--success);
        flex-shrink: 0;
        position: relative;
        animation: pop 0.3s var(--ease-bounce);
    }
    .status-check::after {
        content: '';
        position: absolute;
        left: 5px;
        top: 1px;
        width: 5px;
        height: 9px;
        border: solid white;
        border-width: 0 2.5px 2.5px 0;
        transform: rotate(45deg);
    }
    .status-error-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--danger);
        color: white;
        font-size: 12px;
        font-weight: bold;
        flex-shrink: 0;
        animation: pop 0.3s var(--ease-bounce);
    }
    @keyframes pop {
        0% { transform: scale(0.3); opacity: 0; }
        70% { transform: scale(1.15); opacity: 1; }
        100% { transform: scale(1); }
    }

    .score-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 40px 0;
        grid-column: 1 / -1;
        color: var(--ink-soft);
        font-family: "Battambang", "Inter", system-ui;
        animation: itemIn .3s var(--ease);
    }
    .score-loading .status-spinner {
        width: 28px;
        height: 28px;
        border-width: 3px;
    }

    /* Panel top / footer accents */
    .panel-top {
        background: linear-gradient(180deg, rgba(99,102,241,0.06), rgba(99,102,241,0));
    }

    /* --- Mobile Responsive Media Queries --- */
    @media (max-width: 768px) {
        header {
            position: relative;
            padding: 10px;
            gap: 10px;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
            background: rgba(255,255,255,0.96);
        }
        .header-row {
            flex-direction: column;
            align-items: stretch;
            gap: 8px;
            width: 100%;
        }
        .header-main-row {
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
        }
        .quick-score-group, .action-buttons-group {
            width: 100%;
        }
        .header-controls-row {
            flex-direction: row !important;
        }
        .header-controls-row .dropdown-container {
            flex: 1;
            width: auto;
        }
        .dropdown-container button, .action-buttons-group button {
            width: 100%;
            text-align: center;
        }
        .quick-score-group #quickScore {
            width: 40% !important;
            flex-grow: 1;
        }
        .quick-score-group #applyQuick {
            width: 60%;
        }
        .action-buttons-group button {
            flex: 1;
        }
        .container {
            flex-direction: column;
            padding: 10px;
            gap: 15px;
        }
        .panel {
            max-height: none;
        }
        .student-list {
            max-height: 480px;
        }

        /* Displays 3-column layouts inside centered mobile overlays */
        .grid-dropdown-content {
            position: fixed;
            top: 20% !important;
            left: 50% !important;
            transform: translate(-50%, -50%) scale(0.97) !important;
            width: 90vw;
            max-width: 340px;
            max-height: 80vh;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            box-shadow: var(--shadow-lg);
            border: 1px solid #bbb;
        }
        .grid-dropdown-content.show {
            transform: translate(-50%, -50%) scale(1) !important;
        }

        .mobile-hide {
            display: none !important;
        }
    }

    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after {
            animation-duration: 0.001ms !important;
            animation-iteration-count: 1 !important;
            transition-duration: 0.001ms !important;
        }
    }
</style>
</head>
<body>

<div id="toastLayer"></div>

<header>
   <!--- <div class="header-row header-main-row">
       <h3 style="margin:0;">ពិន្ទុថ្នាក់ទី៧D</h3> -->

    </div>
    <span id="saveStatush" style="color:green;font-weight:bold;"></span>
    <select id="monthSelect" style="display: none;">
        <option value="" disabled selected hidden>ជ្រើសរើសខែ</option>
        <option value="វិច្ឆិកា">វិច្ឆិកា</option>
        <option value="ធ្នូ">ធ្នូ</option>
        <option value="មករា">មករា</option>
        <option value="កុម្ភៈ">កុម្ភៈ</option>
        <option value="ឆមាសទី១">ឆមាសទី១</option>
        <option value="មីនា">មីនា</option>
        <option value="ឧសភា">ឧសភា</option>
        <option value="មិថុនា">មិថុនា</option>
        <option value="កក្កដា">កក្កដា</option>
        <option value="ឆមាសទី២">ឆមាសទី២</option>
    </select>
    <select id="subjectQuick" style="display: none;"></select>

    <div class="header-row header-controls-row">
        <div class="dropdown-container">
            <button type="button" class="btn-gray" id="monthGridBtn" data-prefix="ខែ">
                ខែ <i class="fa fa-caret-down" style="margin-left:5px;"></i>
            </button>
            <div class="grid-dropdown-content" id="monthGridDropdown"></div>
        </div>

        <div class="dropdown-container">
            <button type="button" class="btn-gray" id="subjectGridBtn" data-prefix="មុខវិជ្ជា">
                មុខវិជ្ជា <i class="fa fa-caret-down" style="margin-left:5px;"></i>
            </button>
            <div class="grid-dropdown-content" id="subjectGridDropdown"></div>
        </div>

       <div class="quick-score-group" style="display: none;">
            <input type="number" id="quickScore" placeholder="ពិន្ទុ">
            <button class="btn-blue" id="applyQuick">បញ្ចូលរហ័ស</button>
        </div>

    <div class="header-row header-actions-row">
       <h4 id="selectedStudenth" style="padding: 0px; margin: 0; font-size: 1rem; color: #007bff; display: none;"></h4>
        <div class="action-buttons-group">
            <button class="btn-blue" id="saveListScores">រក្សាទុក</button>
            <button class="btn-gray"><a href="https://edu-kh.github.io/student-attendant/">ស្រង់អវត្តមាន</a></button>
        </div>
    </div>
</header>

<div class="container">
    <div class="panel" id="studentPanel" style="flex:1;">
        <div class="student-header">
            <input type="text" id="searchName" placeholder="ស្វែងរកឈ្មោះសិស្ស...">
            <button class="btn-blue" id="reloadBtn">ពិន្ទុ 7D</button>
        </div>
        <div id="studentList" class="student-list"></div>
    </div>

    <div class="panel" id="scorePanel" style="display: none;">
        <div class="panel-top" style="display:flex; justify-content:space-between; align-items:center; padding:12px 14px; border-bottom:1px solid var(--line);">
            <div style="display:flex; align-items:center; gap:10px;">
                <button class="btn-gray" id="backBtn" style="padding: 5px 10px;"><i class="fa fa-arrow-left"></i></button>
                <h4 id="selectedStudent" style="margin:0;">គ្មានឈ្មោះសិស្ស</h4>
            </div>
            <div style="display:flex; gap:5px;">
                <button class="btn-gray" id="prevStudent"><i class="fa fa-chevron-left"></i></button>
                <div>
                    <button class="btn-blue" id="saveBtn">រក្សាទុក</button>
                </div>
                <button class="btn-gray" id="nextStudent"><i class="fa fa-chevron-right"></i></button>
            </div>
        </div>

        <div style="padding: 16px; flex: 1; overflow-y: auto;">
            <div id="scoresGrid" class="score-grid"></div>
        </div>
        <div style="padding: 15px; border-top: 1px solid var(--line);">
            <button class="btn-gray" id="resetBtn">សម្អាត</button>
            <span id="saveStatus" style="margin-left:10px;color:green;font-weight:bold;"></span>
        </div>
    </div>
</div>

<script>
const SHEET_API_BASE = 'https://script.google.com/macros/s/AKfycbxTteDTUv5Dn_4FpBNtXFIrEtpZZmkQE6BNDrNW7uhvHgWTjgbtxkL8b52vGnDaGIi_1w/exec';

const SUBJECTS = [
  "តែងសេចក្តី", "តាមអាន", "សីលធម៌", "ប្រវត្តិវិទ្យា", "ភូមិវិទ្យា",
    "គណិតវិទ្យា", "រូបវិទ្យា", "គីមីវិទ្យា","ជីវវិទ្យា", "ផែនដីវិទ្យា",
    "អង់គ្លេស", "គេហ", "បារាំង", "កីឡា", "បំណិន", "សុខភាព", "ចិន", "កុំព្យូទ័រ"
];

let currentStudent = null;
let scores = {};
let listScores = {};
let studentNames = [];
let currentIndex = -1;

const monthSelect = document.getElementById('monthSelect');

// --- Ripple effect for a modern tactile feel on buttons ---
document.addEventListener('click', (e) => {
    const btn = e.target.closest('.btn-blue, .btn-gray');
    if (!btn || btn.disabled) return;
    const rect = btn.getBoundingClientRect();
    const size = Math.max(rect.width, rect.height);
    const ripple = document.createElement('span');
    ripple.className = 'ripple';
    ripple.style.width = ripple.style.height = size + 'px';
    ripple.style.left = (e.clientX - rect.left - size / 2) + 'px';
    ripple.style.top = (e.clientY - rect.top - size / 2) + 'px';
    btn.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove());
});

// --- Saving state helpers (no visual animation, just disable) ---
function setBtnSaving(btn, isSaving) {
    if (!btn) return;
    btn.disabled = isSaving;
}

// Disable/enable every button and input on the page during a save operation,
// so the user can't trigger or edit anything else mid-save.
let lockedControls = [];
function lockAllButtons(lock) {
    if (lock) {
        lockedControls = Array.from(document.querySelectorAll('button, input, select'))
            .filter(el => !el.disabled);
        lockedControls.forEach(el => el.disabled = true);
    } else {
        lockedControls.forEach(el => el.disabled = false);
        lockedControls = [];
    }
}

let activeSavingToast = null;

function showToast(mode, text, autoHideMs) {
    const layer = document.getElementById('toastLayer');
    if (!layer) return null;

    const toast = document.createElement('div');
    toast.className = `toast-popup toast-${mode}`;

    let icon = '';
    if (mode === 'saving') icon = '<span class="status-spinner"></span>';
    else if (mode === 'success') icon = '<span class="status-check"></span>';
    else if (mode === 'error') icon = '<span class="status-error-icon">!</span>';

    toast.innerHTML = icon + `<span>${text}</span>`;
    layer.appendChild(toast);

    function remove() {
        if (!toast.parentNode) return;
        toast.classList.add('toast-out');
        setTimeout(() => toast.remove(), 300);
    }

    if (autoHideMs) setTimeout(remove, autoHideMs);

    return { el: toast, remove };
}

// Kept for compatibility with call sites: routes status updates to the popup toast.
function setStatusAnimated(el, mode, text) {
    if (activeSavingToast) {
        activeSavingToast.remove();
        activeSavingToast = null;
    }
    if (mode === 'saving') {
        activeSavingToast = showToast('saving', text);
    } else {
        showToast(mode === 'error' ? 'error' : 'success', text, 1800);
    }
}

function clearStatusAnimated() {
    // No-op: popup toasts auto-dismiss themselves.
}

// Replays entrance animation on a panel by toggling its class after a reflow.
function replayPanelAnimation(el) {
    if (!el) return;
    el.classList.remove('fade-swap');
    void el.offsetWidth;
    el.classList.add('fade-swap');
}

function showScorePanel() {
    const scorePanel = document.getElementById('scorePanel');
    scorePanel.style.display = 'flex';
    replayPanelAnimation(scorePanel);
    document.getElementById('studentPanel').classList.add('mobile-hide');
    document.querySelector('header').classList.add('mobile-hide');
}

function hideScorePanel() {
    document.getElementById('scorePanel').style.display = 'none';
    const studentPanel = document.getElementById('studentPanel');
    studentPanel.classList.remove('mobile-hide');
    document.querySelector('header').classList.remove('mobile-hide');
    replayPanelAnimation(studentPanel);
}

document.getElementById('backBtn').onclick = hideScorePanel;

function loadStudents() {
    const reloadBtn = document.getElementById('reloadBtn');
    const studentListEl = document.getElementById('studentList');

    if (!monthSelect.value) {
        studentListEl.innerHTML = '<div style="padding:10px; color:red; font-size: 1rem">សូមជ្រើសរើសខែជាមុនសិន!</div>';
        return;
    }

    reloadBtn.disabled = true;
    reloadBtn.textContent = 'Loading';
    studentListEl.innerHTML = `
        <div class="score-loading">
            <span class="status-spinner"></span>
            <span>កំពុងទាញឈ្មោះសិស្ស! សូមរង់ចាំ...</span>
        </div>
    `;

    studentNames = [];
    currentIndex = -1;

    fetch(`${SHEET_API_BASE}?action=getStudents&month=${monthSelect.value}`)
        .then(res => res.json())
        .then(data => {
            studentNames = data;
            studentListEl.innerHTML = '';

            data.forEach((name, index) => {
                let div = document.createElement('div');
                div.className = 'student-item';
                div.style.animationDelay = `${Math.min(index * 30, 600)}ms`;
                div.innerHTML = `
                    <i class="fa-solid fa-clipboard-user student-icon"></i>
                    <span>${name}</span>
                    <input type="number" class="student-score" placeholder="ពិន្ទុ" style="width:60px;">
                    <button class="btn-gray">ជ្រើសរើស</button>
                `;

                div.querySelector('button').onclick = () => {
                    currentIndex = studentNames.indexOf(name);
                    selectStudent(name);
                };

                div.querySelector('.student-score').oninput = e => {
                    listScores[name] = e.target.value;
                };

                studentListEl.appendChild(div);
            });
        })
        .catch(err => {
            console.error(err);
            studentListEl.innerHTML = '<div style="padding:10px; color:red;"> សូមជ្រើសរើសខែ !</div>';
        })
        .finally(() => {
            reloadBtn.disabled = false;
            reloadBtn.textContent = 'ពិន្ទុ 7D';
        });
}

document.getElementById('prevStudent').onclick = () => {
    if (!studentNames.length) return;
    currentIndex = currentIndex > 0 ? currentIndex - 1 : studentNames.length - 1;
    selectStudent(studentNames[currentIndex]);
};

document.getElementById('nextStudent').onclick = () => {
    if (!studentNames.length) return;
    currentIndex = currentIndex < studentNames.length - 1 ? currentIndex + 1 : 0;
    selectStudent(studentNames[currentIndex]);
};

async function saveListScoresMerged() {
    const listBtn = document.getElementById('saveListScores');

    if (listBtn.disabled) return;

    const selectedSubject = document.getElementById('subjectQuick').value;
    if (!selectedSubject) {
        setStatusAnimated(null, 'error', '⚠ សូមជ្រើសរើសមុខវិជ្ជា!');
        return;
    }

    lockAllButtons(true);
    setBtnSaving(listBtn, true);
    setStatusAnimated(null, 'saving', 'កំពុងរក្សាទុក....');

    let allScores = {};
    try {
        let res = await fetch(`${SHEET_API_BASE}?action=getAllScores&month=${monthSelect.value}`);
        let data = await res.json();
        allScores = data || {};
    } catch (err) {
        console.error("Failed to fetch all scores", err);
        lockAllButtons(false);
        setBtnSaving(listBtn, false);
        setStatusAnimated(null, 'error', '❌ មិនអាចទាញទិន្នន័យបាន!');
        return;
    }

    let updatedScores = {};
    document.querySelectorAll('.student-item').forEach(item => {
        let studentName = item.querySelector('span').textContent.trim();
        let scoreValue = item.querySelector('.student-score').value.trim();
        if (scoreValue !== '') {
            if (!allScores[studentName]) allScores[studentName] = {};
            allScores[studentName][selectedSubject] = scoreValue;
            updatedScores[studentName] = allScores[studentName];
        }
    });

    if (Object.keys(updatedScores).length === 0) {
        lockAllButtons(false);
        setBtnSaving(listBtn, false);
        setStatusAnimated(null, 'error', '⚠ មិនមានពិន្ទុសម្រាប់រក្សាទុក!');
        return;
    }

    try {
        await fetch(`${SHEET_API_BASE}?action=saveScoresBatch&month=${monthSelect.value}`, {
            method: 'POST',
            body: JSON.stringify(updatedScores)
        });
        setBtnSaving(listBtn, false);
        setStatusAnimated(null, 'success', ' រក្សាទុកពិន្ទុរួចរាល់!');
        document.querySelectorAll('.student-score').forEach(input => input.value = '');
    } catch (err) {
        console.error(err);
        setBtnSaving(listBtn, false);
        setStatusAnimated(null, 'error', '❌ ការរក្សាទុកបរាជ័យ!');
    } finally {
        lockAllButtons(false);
    }
}

document.getElementById('saveListScores').onclick = saveListScoresMerged;

monthSelect.onchange = () => {
    loadStudents();
    document.getElementById('selectedStudent').textContent = 'គ្មានឈ្មោះសិស្ស';
    currentStudent = null;
    scores = {};
    renderScores();
    hideScorePanel();
};

function selectStudent(name) {
    currentStudent = name;
    document.getElementById('selectedStudenth').textContent = name;
    document.getElementById('selectedStudent').textContent = name;
    scores = {};

    document.getElementById('quickScore').value = '';

    showScorePanel();
    showScoreLoading();
    fetch(`${SHEET_API_BASE}?action=getScores&month=${monthSelect.value}&studentName=${encodeURIComponent(name)}`)
        .then(res => res.json())
        .then(data => {
            scores = data.scores || {};
            renderScores();
        })
        .catch(err => {
            console.error(err);
            scores = {};
            renderScores();
        });
}

function showScoreLoading() {
    let grid = document.getElementById('scoresGrid');
    grid.innerHTML = `
        <div class="score-loading">
            <span class="status-spinner"></span>
            <span>កំពុងដំណើរការ...</span>
        </div>
    `;
}

function renderScores() {
    let grid = document.getElementById('scoresGrid');
    grid.innerHTML = '';
    SUBJECTS.forEach((sub, index) => {
        let div = document.createElement('div');
        div.className = 'score-box';
        div.style.animationDelay = `${Math.min(index * 25, 500)}ms`;
        div.innerHTML = `<label>${sub}</label><input type="number" value="${scores[sub] || ''}">`;
        div.querySelector('input').oninput = e => scores[sub] = e.target.value;
        grid.appendChild(div);
    });
}

function saveToSheet() {
    const btn = document.getElementById('saveBtn');

    if (btn.disabled) return;

    if (!currentStudent) {
        setStatusAnimated(null, 'error', 'មិនទាន់ជ្រើសសិស្ស!');
        return;
    }

    document.getElementById('quickScore').value = '';

    lockAllButtons(true);
    setBtnSaving(btn, true);
    setStatusAnimated(null, 'saving', 'កំពុងរក្សាទុក....');

    fetch(`${SHEET_API_BASE}?action=saveScores&month=${monthSelect.value}`, {
        method: 'POST',
        body: JSON.stringify({ studentName: currentStudent, scores })
    })
    .then(() => {
        setBtnSaving(btn, false);
        setStatusAnimated(null, 'success', 'រក្សាទុករួចរាល់!');
    })
    .catch(() => {
        console.error('Save failed');
        setBtnSaving(btn, false);
        setStatusAnimated(null, 'error', 'ការរក្សាទុកបរាជ័យ!');
    })
    .finally(() => {
        lockAllButtons(false);
    });
}

document.getElementById('applyQuick').onclick = () => {
    const saveBtnEl = document.getElementById('saveBtn');
    if (saveBtnEl.disabled) return;
    let sub = document.getElementById('subjectQuick').value;
    let val = document.getElementById('quickScore').value;
    if(!sub) return;
    scores[sub] = val;
    renderScores();
    saveToSheet();
};

document.getElementById('saveBtn').onclick = saveToSheet;

document.getElementById('resetBtn').onclick = () => {
    scores = {};
    renderScores();
};

document.getElementById('reloadBtn').onclick = loadStudents;

document.getElementById('searchName').oninput = e => {
    let term = e.target.value.toLowerCase();
    [...document.getElementById('studentList').children].forEach(div => {
        div.style.display = div.textContent.toLowerCase().includes(term) ? '' : 'none';
    });
};

// Fill quick subject selector background state
const subjectQuickSelect = document.getElementById('subjectQuick');
let placeholderOpt = document.createElement('option');
placeholderOpt.value = "";
placeholderOpt.textContent = "ជ្រើសរើសមុខវិជ្ជា";
placeholderOpt.disabled = true;
placeholderOpt.selected = true;
placeholderOpt.hidden = true;
subjectQuickSelect.appendChild(placeholderOpt);

SUBJECTS.forEach(sub => {
    let opt = document.createElement('option');
    opt.value = sub;
    opt.textContent = sub;
    subjectQuickSelect.appendChild(opt);
});

// Setup 3-Column UI dropdown overlays cleanly
function setupCustomGridDropdown(selectId, buttonId, dropdownId) {
    const realSelect = document.getElementById(selectId);
    const toggleBtn = document.getElementById(buttonId);
    const gridDropdown = document.getElementById(dropdownId);

    gridDropdown.innerHTML = '';

    Array.from(realSelect.options).forEach(option => {
        if (option.value === "") return;

        const choice = document.createElement('div');
        choice.className = 'grid-choice';
        choice.textContent = option.text;
        choice.setAttribute('data-value', option.value);

        if (option.selected) {
            choice.classList.add('active');
            toggleBtn.innerHTML = `${toggleBtn.getAttribute('data-prefix')}: ${option.text} <i class="fa fa-caret-down" style="margin-left:5px;"></i>`;
        }

        choice.onclick = (e) => {
            e.stopPropagation();
            realSelect.value = option.value;

            gridDropdown.querySelectorAll('.grid-choice').forEach(c => c.classList.remove('active'));
            choice.classList.add('active');

            toggleBtn.innerHTML = `${toggleBtn.getAttribute('data-prefix')}: ${option.text} <i class="fa fa-caret-down" style="margin-left:5px;"></i>`;
            gridDropdown.classList.remove('show');

            realSelect.dispatchEvent(new Event('change'));
        };

        gridDropdown.appendChild(choice);
    });

    if (realSelect.value === "") {
        toggleBtn.innerHTML = `${toggleBtn.getAttribute('data-prefix')} <i class="fa fa-caret-down" style="margin-left:5px;"></i>`;
    }

    toggleBtn.onclick = (e) => {
        e.stopPropagation();
        document.querySelectorAll('.grid-dropdown-content').forEach(d => {
            if (d !== gridDropdown) d.classList.remove('show');
        });
        gridDropdown.classList.toggle('show');
    };
}

setupCustomGridDropdown('monthSelect', 'monthGridBtn', 'monthGridDropdown');
setupCustomGridDropdown('subjectQuick', 'subjectGridBtn', 'subjectGridDropdown');

window.onclick = () => {
    document.querySelectorAll('.grid-dropdown-content').forEach(d => d.classList.remove('show'));
};

loadStudents();
renderScores();
</script>
</body>
</html>
